name: Deploy to AWS App Runner

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'gistly' }}

jobs:
  build-and-push:
    name: Build and push container
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
      APP_RUNNER_SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN || vars.APP_RUNNER_SERVICE_ARN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate AWS deployment configuration
        id: validate
        shell: bash
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "AWS_ROLE_ARN is not configured."
            echo "Skipping the AWS build, push, and deployment steps."
            echo "Add the role ARN as a repository secret or variable named AWS_ROLE_ARN to enable deployment."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: ${{ steps.validate.outputs.configured == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: ${{ steps.validate.outputs.configured == 'true' }}
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        if: ${{ steps.validate.outputs.configured == 'true' }}
        run: |
          docker build \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            .
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}

      - name: Push image
        if: ${{ steps.validate.outputs.configured == 'true' }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}

      - name: Start App Runner deployment
        if: ${{ steps.validate.outputs.configured == 'true' }}
        shell: bash
        run: |
          if [ -z "$APP_RUNNER_SERVICE_ARN" ]; then
            echo "APP_RUNNER_SERVICE_ARN is not set; image push complete, skipping App Runner deployment trigger."
            exit 0
          fi

          aws apprunner start-deployment --service-arn "$APP_RUNNER_SERVICE_ARN"